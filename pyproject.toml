[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-anomaly"
version = "0.1.0"
description = "Read-only Elasticsearch data audit foundation for PV anomaly detection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<24",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
train = [
  "torch>=2.12,<2.13",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
